<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in with Google | FamilyFolio Advisor</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            color: #f1f5f9;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Ambient background glow spheres */
        body::before,
        body::after {
            content: '';
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(120px);
            opacity: 0.25;
        }

        body::before {
            background: #6366f1;
            top: -100px;
            left: -100px;
        }

        body::after {
            background: #a855f7;
            bottom: -100px;
            right: -100px;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 44px 36px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
            position: relative;
            z-index: 10;
            text-align: center;
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #a5b4fc;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 22px;
        }

        .logo-icon {
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 1.85rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 10px;
            letter-spacing: -0.02em;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 32px;
        }

        /* Error alert */
        .alert-error {
            display: none;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.88rem;
            margin-bottom: 24px;
            text-align: left;
        }

        /* Google button */
        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            width: 100%;
            padding: 14px 20px;
            border-radius: 14px;
            background: #ffffff;
            color: #1f2937;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            text-decoration: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.2);
        }

        .google-btn:hover {
            transform: translateY(-2px);
            background: #f8fafc;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.25);
        }

        .google-btn:active {
            transform: translateY(1px);
        }

        .google-icon {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 28px 0;
            color: #64748b;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .features {
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
            padding: 16px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #cbd5e1;
            font-size: 0.85rem;
        }

        .feature-item span.icon {
            color: #10b981;
            font-weight: bold;
        }

        .footer-note {
            margin-top: 28px;
            color: #64748b;
            font-size: 0.78rem;
            line-height: 1.5;
        }

        .footer-note a {
            color: #a5b4fc;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="brand-badge">💼 FamilyFolio Advisor</div>
        <div class="logo-icon">🔐</div>
        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in to manage and analyze your family mutual fund portfolio securely.</p>

        <!-- Error Alert (populated if OAuth fails) -->
        <div id="errorAlert" class="alert-error"></div>

        <!-- Google OAuth Sign-in Trigger -->
        <a href="/auth/google" class="google-btn" id="googleLoginBtn">
            <svg class="google-icon" viewBox="0 0 24 24">
                <path fill="#4285F4"
                    d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z" />
                <path fill="#34A853"
                    d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z" />
                <path fill="#FBBC05"
                    d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 10.03 0 12s.45 3.82 1.25 5.42l4.03-3.15z" />
                <path fill="#EA4335"
                    d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" />
            </svg>
            Sign in with Google
        </a>



        <div class="footer-note">
            By signing in, you agree to our
            <a href="#">Terms of Service</a> & <a href="#">Privacy Policy</a>.
        </div>
    </div>

    <script>
        // Check for error parameters in URL (e.g., ?error=access_denied)
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        if (error) {
            const errorBox = document.getElementById('errorAlert');
            errorBox.style.display = 'block';
            errorBox.innerHTML = `⚠️ <b>Authentication Error:</b> ${decodeURIComponent(error)}`;
        }
    </script>

</body>

</html>
