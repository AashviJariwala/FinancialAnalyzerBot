<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FamilyFolio Advisor AI</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            color: #f1f5f9;
            padding: 24px;
        }

        .dashboard-card {
            width: 100%;
            max-width: 580px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 40px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid #6366f1;
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.4);
            margin: 0 auto 18px;
            object-fit: cover;
            background: #1e1b4b;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .user-email {
            color: #a5b4fc;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        .badge-success {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #34d399;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 28px;
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            text-align: left;
            margin-bottom: 30px;
        }

        .detail-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .detail-label {
            color: #94a3b8;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .detail-val {
            color: #f8fafc;
            font-size: 0.92rem;
            font-weight: 600;
            word-break: break-all;
            max-width: 65%;
            text-align: right;
        }

        .btn-group {
            display: flex;
            gap: 14px;
        }

        .btn {
            flex: 1;
            padding: 13px 20px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            border: none;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }
        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.22);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="dashboard-card">
        <img id="userPicture" class="avatar" src="https://lh3.googleusercontent.com/a/default-user" alt="User Profile">
        <h1 id="userName">Loading...</h1>
        <div id="userEmail" class="user-email">...</div>

        <div class="badge-success">
            <span>●</span> Authenticated via Google OAuth
        </div>

        <div class="details-grid">
            <div class="detail-item">
                <span class="detail-label">Google ID</span>
                <span id="userGoogleId" class="detail-val">...</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Database Status</span>
                <span id="dbStatus" class="detail-val">Synced in Users Table</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Tokens Table</span>
                <span id="tokensStatus" class="detail-val">Synced in Google_Tokens</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Token Expiry</span>
                <span id="tokenExpiry" class="detail-val">Active</span>
            </div>
        </div>

        <div class="btn-group">
            <a href="/" class="btn btn-primary">💼 Portfolio Advisor</a>
            <a href="/auth/logout" class="btn btn-logout">🚪 Sign Out</a>
        </div>
    </div>

    <script>
        // Fetch current session profile
        fetch('/api/me')
            .then(res => res.json())
            .then(data => {
                if (!data.authenticated) {
                    window.location.href = '/login';
                    return;
                }
                const u = data.user;
                document.getElementById('userName').textContent = u.name || 'User';
                document.getElementById('userEmail').textContent = u.email || '';
                document.getElementById('userGoogleId').textContent = u.google_id || 'N/A';
                if (u.picture) {
                    document.getElementById('userPicture').src = u.picture;
                }
                if (u.token_expiry) {
                    document.getElementById('tokenExpiry').textContent = new Date(u.token_expiry).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                }
            })
            .catch(() => {
                window.location.href = '/login';
            });
    </script>

</body>
</html>
